[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powertree"
version = "0.6.0"
description = "Electronic circuit power tree analysis: bottom-up power budgeting with min/typ/max corners, margin analysis, flowchart GUI, and PDF/Excel/HTML/CSV reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bin2ai" }]
keywords = ["power", "power-tree", "power-budget", "electronics", "hardware",
            "EDA", "margin-analysis", "voltage-rail", "regulator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

dependencies = [
    "PySide6>=6.6",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "markdown>=3.5",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0", "build", "twine", "pyinstaller"]

[project.urls]
Homepage = "https://github.com/bin2ai/powertree"
Documentation = "https://github.com/bin2ai/powertree/blob/main/docs/USER_GUIDE.md"
Issues = "https://github.com/bin2ai/powertree/issues"
Changelog = "https://github.com/bin2ai/powertree/blob/main/CHANGELOG.md"

[project.scripts]
powertree = "powertree.cli:main"
powertree-mcp = "powertree.mcp_server:main"

[project.gui-scripts]
powertree-gui = "powertree.ui.app_entry:gui_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
